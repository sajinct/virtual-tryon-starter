<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Try-On Demo</title><link rel="stylesheet" href="/src/style.css"></head><body>
<main><h1>Virtual Try-On</h1><p>Choose a demo product, allow your camera, and position yourself in frame. Processing stays in your browser.</p><section class="toolbar"><label>Product <select id="product"></select></label><label>Camera <select id="camera"><option value="user">Front</option><option value="environment">Rear</option></select></label><button id="start">Start camera</button><button id="stop" disabled>Stop</button><button id="capture" disabled>Save snapshot</button></section>
<div class="stage"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><span id="status" role="status">Camera is off</span></div><p class="note">Demo previews are approximate; not accurate sizing or garment fit. Camera imagery is not uploaded.</p></main><script type="module" src="/src/main.js"></script></body></html>
